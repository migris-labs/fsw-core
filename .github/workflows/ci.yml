name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: "2.6.0"

jobs:
  build-test:
    name: ${{ matrix.os }} · ${{ matrix.build_type }}${{ matrix.sanitizers == 'ON' && ' + ASan/UBSan' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        build_type: [Debug, Release]
        sanitizers: ["OFF"]
        include:
          - os: ubuntu-24.04
            build_type: Debug
            sanitizers: "ON"

    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan==${CONAN_VERSION}"

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.sanitizers }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.sanitizers }}-
            conan-${{ matrix.os }}-${{ matrix.build_type }}-

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Conan install
        run: |
          conan install . \
            -s build_type=${{ matrix.build_type }} \
            --build=missing \
            --output-folder=build

      - name: CMake configure
        run: |
          EXTRA=""
          if [ "${{ matrix.sanitizers }}" = "ON" ]; then
            EXTRA="-DMIGRIS_FSW_ENABLE_ASAN=ON -DMIGRIS_FSW_ENABLE_UBSAN=ON"
          fi
          cmake -S . -B build/${{ matrix.build_type }} \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/build/build/${{ matrix.build_type }}/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DMIGRIS_FSW_BUILD_TESTS=ON \
            $EXTRA

      - name: Build
        run: cmake --build build/${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build/${{ matrix.build_type }} --output-on-failure --no-tests=error

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Verify formatting
        run: |
          find include src tests samples -type f \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \
               -o -name '*.cc' -o -name '*.cxx' -o -name '*.hxx' \
               -o -name '*.c' \) \
            -print0 | xargs -0 clang-format-18 --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18
          python -m pip install --upgrade pip
          python -m pip install "conan==${CONAN_VERSION}"

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-tidy-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-tidy-

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Conan install
        run: |
          conan install . \
            -s build_type=Debug \
            --build=missing \
            --output-folder=build

      - name: CMake configure (tidy)
        env:
          CC:  clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build/tidy \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/build/build/Debug/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMIGRIS_FSW_BUILD_TESTS=ON \
            -DMIGRIS_FSW_ENABLE_CLANG_TIDY=ON

      - name: Build with clang-tidy
        run: cmake --build build/tidy --parallel

  zephyr-build:
    name: Zephyr · nucleo_h753zi · samples/hello
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_SDK_VERSION: "0.16.8"
    steps:
      - name: Checkout fsw-core into workspace subdirectory
        # T2 manifest-repo topology: fsw-core must live as a child of
        # the workspace root, with zephyr/ and modules/ cloned as
        # siblings by `west update`. Checking out into ./fsw-core and
        # running west from one level up matches developer-machine
        # layout exactly.
        uses: actions/checkout@v4
        with:
          path: fsw-core

      - name: Install ARM GCC (13.2.Rel1)
        # carlosperate action pulls the official ARM tarball (~150 MB)
        # instead of the apt package (~574 MB; hangs on Azure mirrors).
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.2.Rel1"

      - name: Set up Zephyr workspace + SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: fsw-core
          manifest-file-name: west.yml
          toolchains: arm-zephyr-eabi
          sdk-version: ${{ env.ZEPHYR_SDK_VERSION }}

      - name: west build (nucleo_h753zi)
        working-directory: ${{ github.workspace }}
        run: |
          west build \
            --board nucleo_h753zi \
            --pristine=always \
            fsw-core/samples/hello \
            --build-dir build/zephyr-hello

      - name: Verify ELF
        working-directory: ${{ github.workspace }}
        run: |
          arm-none-eabi-readelf -h build/zephyr-hello/zephyr/zephyr.elf | head -15
          arm-none-eabi-size       build/zephyr-hello/zephyr/zephyr.elf

      - name: Upload zephyr.elf + zephyr.bin + zephyr.map
        uses: actions/upload-artifact@v4
        with:
          name: fsw-core-hello-nucleo_h753zi
          path: |
            build/zephyr-hello/zephyr/zephyr.elf
            build/zephyr-hello/zephyr/zephyr.bin
            build/zephyr-hello/zephyr/zephyr.map
          retention-days: 14

  renode-smoke-hello:
    name: Renode smoke · hello on nucleo_h753zi
    runs-on: ubuntu-24.04
    needs: zephyr-build
    env:
      RENODE_VERSION: "1.16.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download hello ELF artefact
        uses: actions/download-artifact@v4
        with:
          name: fsw-core-hello-nucleo_h753zi
          path: artifacts/hello

      - name: Verify artefact layout
        # actions/upload-artifact@v4 preserves the directory structure
        # of the uploaded paths, so the ELF lands at the deep path
        # below. Fail loud here if upstream layout changes.
        run: |
          ls -la artifacts/hello/build/zephyr-hello/zephyr/
          test -f artifacts/hello/build/zephyr-hello/zephyr/zephyr.elf

      - name: Install Renode ${{ env.RENODE_VERSION }}
        # Self-contained portable bundle (bundles .NET 8) — the .deb
        # 404s on Azure-hosted Ubuntu mirrors (same gotcha as
        # hw-catalog's renode-e2e job).
        run: |
          curl -fsSL -o /tmp/renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz"
          sudo mkdir -p /opt/renode
          sudo tar -xzf /tmp/renode.tar.gz -C /opt/renode --strip-components=1
          sudo ln -sf /opt/renode/renode /usr/local/bin/renode
          renode --version

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Renode UART smoke
        env:
          FSW_CORE_HELLO_ELF: ${{ github.workspace }}/artifacts/hello/build/zephyr-hello/zephyr/zephyr.elf
        run: pytest tests/renode -v
