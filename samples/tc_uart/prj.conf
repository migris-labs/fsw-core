# Minimum Zephyr configuration for the fsw-5 TC-router UART sample.
#
# We own USART3 end-to-end for the packet exchange: no boot banner,
# no log backend, no console printk competing for the same wire.
# Anything that prints would corrupt the packet stream the ground
# tooling is reading byte-exact off the UART.

CONFIG_BOOT_BANNER=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_UART_CONSOLE=n

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

CONFIG_THREAD_NAME=y
# fsw-9 added the parameter datapool (a main()-local), larger TC/TM
# buffers, and the PUS-20 dispatch call chain; 2048 keeps comfortable
# headroom over the deepest path.
CONFIG_MAIN_STACK_SIZE=2048

# fsw-16: on-chip flash + the flash_map partition layer for the
# non-volatile parameter store. The board devicetree defines a 256 KB
# storage_partition (two 128 KB sectors); CONFIG_FLASH_MAP gives us the
# flash_area_* API over it. CONFIG_SOC_FLASH_STM32 enables the in-tree
# STM32H7 flash driver (drivers/flash/flash_stm32h7x.c). NVS is *not*
# usable on STM32H7 — the 128 KB sector overflows NVS's uint16_t
# sector_size — so we use the raw flash_area_* API directly.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SOC_FLASH_STM32=y
